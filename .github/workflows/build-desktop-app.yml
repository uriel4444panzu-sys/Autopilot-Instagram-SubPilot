name: Build Desktop App (Windows)

# Construit l'installateur Windows de SubPilot Control Room sur un vrai
# runner Windows (pas de souci de compatibilité/signature type wine).
# Déclenchement manuel uniquement. L'installateur est déposé en artifact
# du run (téléchargeable depuis l'onglet Actions, disponible ~90 jours).

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'installateur Windows
        run: npm run build:win

      - name: Publier l'installateur
        uses: actions/upload-artifact@v4
        with:
          name: SubPilot-Control-Room-Windows
          path: desktop-app/dist/*.exe
          retention-days: 90

      - name: Pousser l'installateur sur une branche de livraison
        shell: bash
        run: |
          EXE=$(ls dist/*.exe | head -n1)
          rm -rf /tmp/deliver
          mkdir -p /tmp/deliver
          cp "$EXE" /tmp/deliver/
          cd /tmp/deliver
          git init -q
          git checkout -q -b desktop-builds
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "build: $(basename "$EXE")"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin desktop-builds
