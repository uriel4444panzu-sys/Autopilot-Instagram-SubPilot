name: Generate Single Post

# Génère UN SEUL post (caption + hashtags + image) pour une date et un
# type précis, en BROUILLON (status: "draft"). Utile pour remplacer un
# post supprimé/rejeté sans regénérer tout un lot.
#
# Déclenchement manuel uniquement.
#
# Secret requis : OPENAI_API_KEY

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date du post (YYYY-MM-DD)"
        required: true
      type:
        description: "Type de post"
        required: false
        default: "feed"
        type: choice
        options:
          - feed
          - story
          - reel
      reel_video:
        description: "Chemin de la vidéo (requis seulement si type=reel, ex: videos/x.mp4)"
        required: false
        default: ""
      quality:
        description: "Qualité image (low, medium, high, auto)"
        required: false
        default: "auto"

permissions:
  contents: write

jobs:
  generate-single:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate Single Post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TEXT_MODEL: ${{ vars.OPENAI_TEXT_MODEL }}
          DATE: ${{ github.event.inputs.date }}
          TYPE: ${{ github.event.inputs.type }}
          REEL_VIDEO: ${{ github.event.inputs.reel_video }}
          IMAGE_QUALITY: ${{ github.event.inputs.quality }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-single.js

      - name: Committer l'image générée
        run: |
          # calendar.json est déjà enregistré par generate-single.js via
          # l'API Contents de GitHub (relecture + fusion à chaque tentative)
          # — un "git push" classique peut entrer en conflit RÉEL (pas
          # juste "quelqu'un a poussé, retente") quand deux commits ajoutent
          # chacun une entrée en fin de tableau JSON en même temps, ce que
          # git ne peut pas fusionner tout seul (constaté en usage réel).
          # Seule l'image (fichier nouveau, nom unique) passe encore par
          # git ici : son risque de conflit réel est quasi nul.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed/ stories/
          if git diff --cached --quiet; then
            echo "Rien à committer."
            exit 0
          fi
          git commit -m "chore: image générée (OpenAI)"
          for i in $(seq 1 10); do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push refusé, nouvelle tentative ($i/10)..."
            git rebase --abort 2>/dev/null || true
            sleep 6
          done
          echo "::error::Impossible de pousser l'image générée après plusieurs tentatives."
          exit 1
