name: Generate Week (rythme par défaut, OpenAI)

# Génère automatiquement le rythme de publication par défaut : 4 posts
# feed + 4 stories pour la semaine à venir (lundi->dimanche), répartis
# pour qu'aucun jour ne soit vide. Le jour qui cumule les deux types (et
# le type qui démarre la semaine) varie d'une semaine à l'autre. Chaque
# brouillon a déjà sa date, mais reste en status: "draft" — AUCUNE
# publication automatique, tout attend ta validation manuelle.
#
# Pour insérer un reel cette semaine (remplace le créneau du jour choisi,
# vidéo déjà présente dans le repo) : lance ce workflow manuellement avec
# reel_day et reel_video renseignés.
#
# Déclenchement :
#   - automatique chaque dimanche (prépare la semaine suivante à l'avance,
#     sans reel puisque le cron ne peut pas fournir de vidéo) ;
#   - manuel à tout moment (onglet Actions -> "Generate Week" -> Run workflow).
#
# Secret requis : OPENAI_API_KEY

on:
  workflow_dispatch:
    inputs:
      reel_day:
        description: "Jour à remplacer par un reel (0=demain .. 6=dans 7 jours), vide = pas de reel"
        required: false
        default: ""
      reel_video:
        description: "Chemin du fichier vidéo déjà présent dans le repo (ex: videos/mon-reel.mp4)"
        required: false
        default: ""
  schedule:
    - cron: "0 8 * * 0" # chaque dimanche à 8:00 UTC

permissions:
  contents: write

jobs:
  generate-week:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate Week
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TEXT_MODEL: ${{ vars.OPENAI_TEXT_MODEL }}
          REEL_DAY: ${{ github.event.inputs.reel_day }}
          REEL_VIDEO: ${{ github.event.inputs.reel_video }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-week.js

      - name: Committer les images générées
        run: |
          # calendar.json est déjà enregistré par generate-week.js via l'API
          # Contents de GitHub (relecture + fusion à chaque tentative) — un
          # "git push" classique peut entrer en conflit RÉEL (pas juste
          # "quelqu'un a poussé, retente") quand deux commits ajoutent
          # chacun une entrée en fin de tableau JSON en même temps, ce que
          # git ne peut pas fusionner tout seul (constaté en usage réel).
          # Seules les images (fichiers nouveaux, noms uniques) passent
          # encore par git ici : leur risque de conflit réel est quasi nul.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # generate-week.js écrit aussi calendar.json sur disque en local
          # (pour un usage hors GitHub Actions) — cette copie locale n'est
          # jamais commitée ici (déjà enregistrée via l'API juste avant) et
          # bloquerait "git pull --rebase" ("unstaged changes") si on ne
          # l'annule pas.
          git checkout -- calendar.json 2>/dev/null || true
          git add feed/ stories/
          if git diff --cached --quiet; then
            echo "Rien à committer."
            exit 0
          fi
          git commit -m "chore: images de la semaine générées (OpenAI)"
          for i in $(seq 1 10); do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push refusé, nouvelle tentative ($i/10)..."
            git rebase --abort 2>/dev/null || true
            sleep 6
          done
          echo "::error::Impossible de pousser les images générées après plusieurs tentatives."
          exit 1
