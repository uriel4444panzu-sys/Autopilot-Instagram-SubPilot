name: Generate Posts (batch, OpenAI)

# Déclenchement MANUEL uniquement : onglet Actions -> "Generate Posts (batch, OpenAI)" -> Run workflow.
#
# Génère un LOT de posts complets (caption + hashtags + image) via l'API
# OpenAI, avec des angles non-répétitifs par rapport aux posts déjà
# présents dans calendar.json. Les ajoute en BROUILLON (status: "draft").
#
# Ne publie JAMAIS rien : publish.js ignore tout post dont le status
# n'est pas "approved" (ou absent). Pour faire partir un brouillon,
# édite calendar.json à la main : fixe une vraie "date" et retire le
# champ "status" (ou passe-le à "approved").
#
# Secret requis : OPENAI_API_KEY

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Nombre de posts à générer"
        required: false
        default: "7"
      type:
        description: "Type de post"
        required: false
        default: "feed"
        type: choice
        options:
          - feed
          - story
      quality:
        description: "Qualité image (low, medium, high, auto)"
        required: false
        default: "auto"

permissions:
  contents: write

jobs:
  generate-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate Posts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TEXT_MODEL: ${{ vars.OPENAI_TEXT_MODEL }}
          COUNT: ${{ github.event.inputs.count }}
          POST_TYPE: ${{ github.event.inputs.type }}
          IMAGE_QUALITY: ${{ github.event.inputs.quality }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-posts.js

      - name: Committer les images générées
        run: |
          # calendar.json est déjà enregistré par generate-posts.js via
          # l'API Contents de GitHub (relecture + fusion à chaque tentative)
          # — un "git push" classique peut entrer en conflit RÉEL (pas
          # juste "quelqu'un a poussé, retente") quand deux commits ajoutent
          # chacun une entrée en fin de tableau JSON en même temps, ce que
          # git ne peut pas fusionner tout seul (constaté en usage réel).
          # Seules les images (fichiers nouveaux, noms uniques) passent
          # encore par git ici : leur risque de conflit réel est quasi nul.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed/ stories/
          if git diff --cached --quiet; then
            echo "Rien à committer."
            exit 0
          fi
          git commit -m "chore: images générées (OpenAI)"
          for i in $(seq 1 10); do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push refusé, nouvelle tentative ($i/10)..."
            git rebase --abort 2>/dev/null || true
            sleep 6
          done
          echo "::error::Impossible de pousser les images générées après plusieurs tentatives."
          exit 1
