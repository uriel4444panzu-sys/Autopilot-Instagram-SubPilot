name: Publier sur Instagram

# Auto (quasi instantané) : se déclenche dès qu'un commit modifie
# calendar.json (ex: approbation d'un brouillon dans l'app), et envoie à
# Buffer tout post approuvé pas encore envoyé — même si sa date est dans
# plusieurs jours : c'est Buffer qui programme (dueAt) et publie tout
# seul le bon jour. Un post reste en attente tant qu'il n'a pas été
# approuvé dans l'app (status: "approved"). Un commit qui n'ajoute que
# des brouillons (génération auto) déclenche aussi une exécution, mais
# elle ne trouve rien à envoyer et se termine aussitôt (inoffensif).
# Auto (filet de sécurité) : tourne aussi chaque jour à 10:00 UTC, au cas
# où un commit sur calendar.json aurait été fait autrement (hors app).
# Manuel (toujours possible) : onglet Actions -> "Publier sur Instagram" -> Run workflow.
#   - only_id vide  = envoie tous les posts approuvés pas encore envoyés ;
#   - only_id = id  = envoie seulement ce post du calendar.json (validation à l'unité) ;
#   - dry_run true  = simule sans publier ;
#   - publisher     = "buffer" (par défaut, nouveau) ou "meta" (ancien, pour rollback).
#
# Secrets requis (Settings -> Secrets and variables -> Actions) :
#   - PUBLISHER=buffer -> BUFFER_API_KEY, BUFFER_INSTAGRAM_CHANNEL_ID
#   - PUBLISHER=meta   -> IG_USER_ID, IG_ACCESS_TOKEN
# Variables optionnelles (onglet "Variables", non sensibles) :
#   - BUFFER_DEFAULT_TIMEZONE (défaut Europe/Paris), BUFFER_DEFAULT_TIME (défaut 10:00)

on:
  workflow_dispatch:
    inputs:
      only_id:
        description: "Publier seulement ce post (id). Vide = tous les posts approuvés pas encore envoyés."
        required: false
        default: ""
      dry_run:
        description: "Tester sans publier (true/false)"
        required: false
        default: "false"
      publisher:
        description: "Provider de publication (buffer ou meta)"
        required: false
        default: "buffer"
        type: choice
        options:
          - buffer
          - meta
  schedule:
    - cron: "0 10 * * *" # chaque jour à 10:00 UTC
  push:
    branches: ["main"]
    paths: ["calendar.json"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Calculer l'URL publique des médias (raw.githubusercontent)
        id: media
        run: echo "base=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/" >> "$GITHUB_OUTPUT"

      - name: Publier
        env:
          PUBLISHER: ${{ github.event.inputs.publisher }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          BUFFER_DEFAULT_TIMEZONE: ${{ vars.BUFFER_DEFAULT_TIMEZONE }}
          BUFFER_DEFAULT_TIME: ${{ vars.BUFFER_DEFAULT_TIME }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE: ${{ steps.media.outputs.base }}
          ONLY_ID: ${{ github.event.inputs.only_id }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: node publish.js

      - name: Enregistrer les posts publiés
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if ! git diff --quiet -- published.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add published.json
            git commit -m "chore: journal des posts publiés"
            git push
          else
            echo "Aucun nouveau post publié."
          fi
