name: Publier sur Instagram

# Manuel (recommandé) : onglet Actions -> "Publier sur Instagram" -> Run workflow.
#   - only_id vide  = publie tous les posts dus (date <= aujourd'hui) ;
#   - only_id = id  = publie seulement ce post du calendar.json (validation à l'unité) ;
#   - dry_run true  = simule sans publier ;
#   - publisher     = "buffer" (par défaut, nouveau) ou "meta" (ancien, pour rollback).
# Auto (optionnel) : décommente le bloc "schedule". Reste désactivé tant que le
# provider buffer n'a pas été validé manuellement (voir BUFFER_SETUP.md).

on:
  workflow_dispatch:
    inputs:
      only_id:
        description: "Publier seulement ce post (id). Vide = tous les posts dus."
        required: false
        default: ""
      dry_run:
        description: "Tester sans publier (true/false)"
        required: false
        default: "false"
      publisher:
        description: "Provider de publication (buffer ou meta)"
        required: false
        default: "buffer"
        type: choice
        options:
          - buffer
          - meta
  # schedule:
  #   - cron: "0 10 * * *"   # chaque jour à 10:00 UTC

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Calculer l'URL publique des médias (raw.githubusercontent)
        id: media
        run: echo "base=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/" >> "$GITHUB_OUTPUT"

      - name: Publier
        env:
          PUBLISHER: ${{ github.event.inputs.publisher }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE: ${{ steps.media.outputs.base }}
          ONLY_ID: ${{ github.event.inputs.only_id }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: node publish.js

      - name: Enregistrer les posts publiés
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if ! git diff --quiet -- published.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add published.json
            git commit -m "chore: journal des posts publiés"
            git push
          else
            echo "Aucun nouveau post publié."
          fi
